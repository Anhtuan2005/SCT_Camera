experiment_version: priority-pilot-v2-single-participant-2026-08-18
source: config/settings.yaml plus explicit per-clip zone thresholds
thresholds:
  intrusion:
    allowed_classes:
    - person
    reset_frames_unused_by_current_line_semantics: 30
  loitering:
    threshold_seconds: 20
    state_grace_seconds: 3
  suspicious_behavior:
    threshold_seconds: 180
    state_grace_seconds: 3
    min_history_points: 5
    stationary_max_displacement_ratio: 0.04
    pacing_path_min_ratio: 0.18
    pacing_net_max_ratio: 0.08
  theft:
    enabled: true
    vehicle_classes:
    - bicycle
    - car
    - motorcycle
    - truck
    proximity_distance_meters: 1.5
    meters_per_frame_diagonal: 12
    proximity_seconds: 10
    vehicle_move_min_ratio: 0.025
    same_direction_min_cosine: 0.65
    pacing_min_passes: 2
    score_threshold: 2
    require_near_duration: true
    require_vehicle_signal: true
    pose_wrist_distance_ratio: 0.055
    near_gap_reset_seconds: 2
  line_crossing:
    directions_counted:
    - IN
    - OUT
    crossing_rule: center path crossing OR newly intersecting person bbox
